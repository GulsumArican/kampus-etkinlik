<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <link rel="stylesheet" href="2416501834.css">
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
    </header>
    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
        
    </nav>
    <main>
       <form id="etkinlik-formu" data-mode="guncelle">
    <label for="ad">Etkinlik Adı*</label><br>
    <input type="text" id="ad" name="ad" required style="width: 100%; margin-bottom: 15px; padding: 8px;"><br>

    <label for="kategori">Kategori*</label><br>
    <select id="kategori" name="kategori" required style="width: 100%; margin-bottom: 15px; padding: 8px;">
        <option value="">Seçiniz -</option>
        <option value="Seminer">Seminer</option>
        <option value="Atölye">Atölye</option>
        <option value="Sosyal">Sosyal</option>
    </select><br>

    <label for="tarih">Tarih*</label><br>
    <input type="date" id="tarih" name="tarih" required style="width: 100%; margin-bottom: 15px; padding: 8px;"><br>

    <label for="saat">Saat*</label><br>
    <input type="time" id="saat" name="saat" required style="width: 100%; margin-bottom: 15px; padding: 8px;"><br>

    <label for="yer">Yer*</label><br>
    <input type="text" id="yer" name="yer" required style="width: 100%; margin-bottom: 15px; padding: 8px;"><br>

    <label for="kontenjan">Kontenjan</label><br>
    <input type="number" id="kontenjan" name="kontenjan" style="width: 100%; margin-bottom: 15px; padding: 8px;"><br>

    <button type="submit" style="background-color: #2e7d32; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Kaydet</button>
    <span id="hata-mesaji" style="color: red; font-weight: bold; display: block; margin-top: 10px;"></span>
        </form>
    </main>
    <footer>
        <p>Gülsüm Arıcan - 2416501834 - 2026</p>
    </footer>
    <script type="module" src="js/event-form.js"></script>
</body>
</html>
